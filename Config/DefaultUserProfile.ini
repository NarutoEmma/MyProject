[UserProfile.DefaultSettings]
; Default settings for new user profiles

; Player Identity
DefaultPlayerName=Player
DefaultPlayerLevel=1
DefaultExperiencePoints=0

; Game Statistics (Initial Values)
DoorsDestroyed=0
ZombiesDefeated=0
TotalPlayTime=0.0
GamesPlayed=0

; Audio Settings (0.0 - 1.0)
MasterVolume=0.7
MusicVolume=0.5
SFXVolume=0.8

; Gameplay Settings
MouseSensitivity=0.5
InvertYAxis=False

; Graphics Settings
; Quality: 0=Low, 1=Medium, 2=High, 3=Ultra
GraphicsQuality=2
VSync=True
FrameRateLimit=60

; Experience System
XPPerDoorDestroyed=10
XPPerZombieDefeated=25
XPRequiredPerLevel=100
MaxPlayerLevel=50

; Auto-Save Settings
AutoSaveEnabled=True
AutoSaveIntervalMinutes=5

; Profile Validation
MaxPlayerNameLength=20
AllowedPlayerNameCharacters="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_- "
